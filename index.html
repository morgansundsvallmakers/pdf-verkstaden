<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PDF-verkstaden</title>
    <link rel="stylesheet" href="style.css?v=2">
  </head>
  <body>
    <div id="app">
			<h1>PDF-verkstaden</h1>

			<p>Bearbeta PDF-filer direkt i webbläsaren. Inga filer laddas upp.</p>

			<button id="merge-button" type="button">Slå ihop PDF</button>

			<input
			  id="merge-input"
			  type="file"
			  accept="application/pdf"
			  multiple
			  hidden
			/>
			<ul id="merge-file-list"></ul>
			<p id="merge-message"></p>
			
			<button id="merge-create-button" type="button">
					Skapa sammanslagen PDF
				</button>
				
			<div id="merge-download" hidden>
				<label for="merge-filename">Filnamn</label>
				<input id="merge-filename" type="text" value="sammanslagen.pdf">			

				<button id="merge-download-button" type="button">
					Ladda ner PDF
				</button>
			</div>
			<button id="split-button" type="button">Dela PDF</button>

			<input
				id="split-input"
				type="file"
				accept="application/pdf"
				hidden
			/>

			<div id="split-controls" hidden>
				<label for="split-after-page">Dela efter sida</label>
				<input id="split-after-page" type="number" min="1">

				<button id="split-create-button" type="button">
					Skapa två PDF-filer
				</button>
			</div>

			<p id="split-message"></p>
			<div id="split-download" hidden>
				<button id="split-download-button" type="button">
					Ladda ner båda PDF-filerna
				</button>
			</div>

			<button id="booklet-button" type="button">Gör broschyr</button>

			<input
				id="booklet-input"
				type="file"
				accept="application/pdf"
				hidden
			/>

			<p id="booklet-message"></p>
			<div id="booklet-download" hidden>
				<label for="booklet-filename">Filnamn</label>
				<input id="booklet-filename" type="text" value="broschyr.pdf">

				<button id="booklet-download-button" type="button">
					Ladda ner broschyr-PDF
				</button>
			</div>
   </div>

		<!-- PDF-biblioteket ligger lokalt så att inga externa skript behöver hämtas. -->
		<script src="pdf-lib.min.js"></script>
		<script src="main.js?v=26"></script>

  </body>
</html>
